services:
  # Main handwriting recognition API
  handwriting-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: handwriting-api
    ports:
      - "8000:8000"
    environment:
      - HANDWRITING_LOG_LEVEL=INFO
      - HANDWRITING_OCR_USE_GPU=false
      - HANDWRITING_HOST=0.0.0.0
      - HANDWRITING_PORT=8000
      - HANDWRITING_MAX_IMAGE_SIZE=10485760  # 10MB
      - HANDWRITING_MAX_CONCURRENT_REQUESTS=10
      - HANDWRITING_REQUEST_TIMEOUT=30
      - HANDWRITING_ENABLE_METRICS=true
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - handwriting-network
    depends_on:
      - redis
      - prometheus

  # GPU-enabled version (optional, requires NVIDIA Docker runtime)
  handwriting-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: gpu
    container_name: handwriting-api-gpu
    ports:
      - "8001:8000"
    environment:
      - HANDWRITING_LOG_LEVEL=INFO
      - HANDWRITING_OCR_USE_GPU=true
      - HANDWRITING_HOST=0.0.0.0
      - HANDWRITING_PORT=8000
      - HANDWRITING_MAX_IMAGE_SIZE=10485760  # 10MB
      - HANDWRITING_MAX_CONCURRENT_REQUESTS=20
      - HANDWRITING_REQUEST_TIMEOUT=30
      - HANDWRITING_ENABLE_METRICS=true
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - handwriting-network
    depends_on:
      - redis
      - prometheus
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: handwriting-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - handwriting-network
    command: redis-server --appendonly yes

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: handwriting-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - handwriting-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: handwriting-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - handwriting-network
    depends_on:
      - prometheus

  # Nginx reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: handwriting-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - handwriting-network
    depends_on:
      - handwriting-api

  # Development environment
  handwriting-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: handwriting-api-dev
    ports:
      - "8002:8000"
    environment:
      - HANDWRITING_LOG_LEVEL=DEBUG
      - HANDWRITING_DEBUG=true
      - HANDWRITING_RELOAD=true
      - HANDWRITING_OCR_USE_GPU=false
      - HANDWRITING_HOST=0.0.0.0
      - HANDWRITING_PORT=8000
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    restart: unless-stopped
    networks:
      - handwriting-network
    profiles:
      - dev

networks:
  handwriting-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data: